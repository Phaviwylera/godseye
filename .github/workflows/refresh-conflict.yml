name: refresh-conflict
on:
  schedule:
    - cron: "41 3 * * 3"   # Wednesday: UCDP publishes GED updates around the middle of the month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh UCDP/PRIO GED conflict events (last 180 days)
        run: python tools/build_conflict.py
      - name: Commit snapshot
        run: |
          git config user.name "godseye-bot"
          git config user.email "godseye-bot@users.noreply.github.com"
          git add data/conflict.json
          if git diff --cached --quiet; then
            echo "no conflict data changes"
          else
            git commit -m "chore: refresh UCDP/PRIO GED conflict events"
            git push
          fi
