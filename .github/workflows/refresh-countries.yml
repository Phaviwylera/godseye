name: refresh-countries
on:
  schedule:
    - cron: "51 7 5 * *"   # monthly, 5th: admin-0 boundaries move on geological time scales
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh admin-0 country boundaries + ISO codes
        run: python tools/build_countries.py
      - name: Commit snapshot
        run: |
          git config user.name "godseye-bot"
          git config user.email "godseye-bot@users.noreply.github.com"
          git add data/countries.json
          if git diff --cached --quiet; then
            echo "no countries data changes"
          else
            git commit -m "chore: refresh country boundaries"
            git push
          fi
