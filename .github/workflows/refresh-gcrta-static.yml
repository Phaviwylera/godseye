name: refresh-gcrta-static
on:
  schedule:
    - cron: "43 4 * * 1" # weekly, after the operator's schedule changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh compact GCRTA static GTFS
        run: python tools/refresh_gcrta_static.py
      - name: Commit snapshot
        run: |
          git config user.name "godseye-bot"
          git config user.email "godseye-bot@users.noreply.github.com"
          git add data/gcrta-static.json
          if git diff --cached --quiet; then
            echo "no GCRTA static changes"
          else
            git commit -m "chore: refresh GCRTA static GTFS"
            git push origin "HEAD:${GITHUB_REF}"
          fi
