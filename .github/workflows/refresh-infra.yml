name: refresh-infra
on:
  schedule:
    - cron: "17 5 * * 0"   # weekly, Sundays: OSM edits settle over the week
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh infrastructure datasets (OSM volcanoes/plants/harbours + open cable map)
        run: python tools/build_infra.py
      - name: Commit snapshot
        run: |
          git config user.name "godseye-bot"
          git config user.email "godseye-bot@users.noreply.github.com"
          git add data/volcanoes.json data/power.json data/ports.json data/cables.geojson
          if git diff --cached --quiet; then
            echo "no infra changes"
          else
            git commit -m "chore: weekly infrastructure dataset refresh"
            git push
          fi
