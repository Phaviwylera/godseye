# GOD'S EYE — Netlify config
[build]
  command = "python3 tools/build_site.py"
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild" 

# route the camera-feed relay through the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/regions/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/data/cameras.index.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
