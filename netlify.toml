# GOD'S EYE — Netlify config
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild" 

# route the camera-feed relay through the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
